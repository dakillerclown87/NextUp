<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextUp live widget</title><style>
:root{--bg:#080f19;--panel:#111c29;--text:#f5f7fb;--muted:#a4b2c5;--line:#2a3849;--accent:#19cee4;--accent2:#d23eea}*{box-sizing:border-box}html{color-scheme:dark;background:transparent}body{margin:0;background:transparent;color:var(--text);font:16px Segoe UI,system-ui,sans-serif}.card{margin:3px;padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(120deg,color-mix(in srgb,var(--panel) 94%,transparent),color-mix(in srgb,var(--bg) 94%,transparent));box-shadow:inset 0 0 0 3px #ffffff06;min-height:210px;display:flex;gap:20px;align-items:center;overflow:hidden}.cover{width:122px;height:122px;object-fit:cover;border-radius:17px;box-shadow:0 8px 20px #0005;background:var(--bg);flex-shrink:0}.fallback{display:grid;place-items:center;font-size:52px;color:var(--accent2);border:1px solid var(--line)}.info{flex:1;min-width:0}.brand{letter-spacing:3px;font-size:12px;color:var(--muted);margin-bottom:9px}.brand span{color:var(--accent)}h1{font-size:27px;margin:0 0 6px;line-height:1.12;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}a{color:inherit;text-decoration:none}.artist{color:var(--accent2);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.requester{font-size:12px;color:var(--muted);margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:7px;background:var(--line);border-radius:8px;margin-top:14px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}.times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px}.bars{width:114px;height:104px;display:flex;align-items:flex-end;gap:3px;flex-shrink:0}.bars i{flex:1;min-height:5px;background:linear-gradient(0deg,var(--accent),var(--accent2));animation:dance .95s ease-in-out infinite alternate;transform-origin:bottom;height:100%;animation-play-state:paused}.playing .bars i{animation-play-state:running}@keyframes dance{from{transform:scaleY(.15)}to{transform:scaleY(.94)}}.gradient .bars{display:none}.gradient .cover{order:3;width:140px;height:140px}.gradient .brand{letter-spacing:4px}.queue{display:block}.queue .entry{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}.entry .cover{width:44px;height:44px;border-radius:8px}.entry .info h1{font-size:17px}.entry .artist,.entry .requester{font-size:11px;margin:3px 0}.offline{opacity:.65}.empty{font-size:17px;color:var(--muted)}@media(max-width:480px){.card{padding:14px;gap:14px}.cover{width:76px;height:76px}.bars{width:60px;height:75px}h1{font-size:21px}.artist{font-size:16px}.gradient .cover{width:90px;height:90px}}@media(prefers-reduced-motion:reduce){.bars i{animation:none;transform:scaleY(.4)}}
[data-eq-style=rounded] i{border-radius:99px}[data-eq-style=mirror]{align-items:center!important}[data-eq-style=mirror] i{transform-origin:center!important;border-radius:99px}</style></head><body><div id="widget" class="card"><span class="empty">Waiting for NextUp…</span></div><script src="/widget-audio.js?key=__OVERLAY_KEY__"></script><script src="/widget-singularity.js?key=__OVERLAY_KEY__"></script><script src="/widget-renderer.js?key=__OVERLAY_KEY__"></script><script src="/widget-v3.js?key=__OVERLAY_KEY__"></script><script>
'use strict';NextUpAudio.connect(location.href);const box=document.getElementById('widget'),params=new URLSearchParams(location.search),key=params.get('key'),kind=location.pathname.split('/').pop();let sample={seconds:0,at:0,playing:false,duration:0},signature='',goodAt=0;const time=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function cover(t){return t.art&&t.art.startsWith('https://')?`<img class="cover" src="${esc(t.art)}" alt="Album artwork" referrerpolicy="no-referrer">`:'<div class="cover fallback">♫</div>'}function info(row,progress,label){const t=row.track;return `<div class="info">${progress&&label?'<div class="brand">'+esc(label)+'</div>':''}<h1><a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.title)}</a></h1><div class="artist">${esc(t.artists.join(', '))}</div><div class="requester">Requested by ${esc(row.requester)}</div>${progress?'<div class="track"><div class="fill"></div></div><div class="times"><span id="elapsed">0:00</span><span>'+time(t.duration)+'</span></div>':''}</div>`}let refreshing=false;async function refresh(){if(refreshing)return;refreshing=true;try{const r=await fetch('/state?key='+encodeURIComponent(key),{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error();const d=await r.json();box.classList.remove('offline');let layout=kind==='now'?'spectrum':kind,equalizer=d.equalizer,eqStyle=d.equalizer_style||'bars',colors=d.colors;const preset=params.has('preset_id')?d.presets.find(p=>p.id===params.get('preset_id')):params.has('preset')?d.presets[Number(params.get('preset'))]:null;if(params.has('preset_id')&&!preset){NextUpWidget.resetPresentation(box);box.replaceChildren();box.className='card';box.textContent='This widget has been removed.';sample.playing=false;return}if(preset){layout=preset.layout;equalizer=preset.equalizer;eqStyle=preset.equalizer_style||'bars';colors=preset.colors}const label=preset?.label??((d.branding!==false?'NEXTUP • ':'')+(layout==='queue'?'UP NEXT':'NOW PLAYING'));if(params.get('eq')==='0')equalizer=false;for(const k of ['bg','panel','text','muted','line','accent','accent2']){document.documentElement.style.removeProperty('--'+k);if(colors[k])document.documentElement.style.setProperty('--'+k,colors[k])}const current=d.current;sample={seconds:d.playback.progress,at:performance.now(),playing:d.playback.status==='Playing',duration:current?.track.duration||0};goodAt=performance.now();if(['nextup-widget-v2','nextup-widget-v3'].includes(preset?.format)){box.className='designer-host'+(sample.playing?' playing':'');box.style.cssText='width:100%;margin:0;padding:0';if(preset.format==='nextup-widget-v3'||['fold','horizon'].includes(preset.transition)){NextUpWidget.present(box,preset,current,d.items,preset.background.image?'/widget-assets/'+preset.background.image+'.png?key='+encodeURIComponent(key):'',font=>'/widget-fonts/'+font.id+'.'+font.format+'?key='+encodeURIComponent(key),d.playback.status,d.playback.progress);signature='';return}NextUpWidget.resetPresentation(box);const sig=JSON.stringify([current,d.items,preset]);if(sig!==signature){signature=sig;NextUpWidget.render(box,preset,current,d.items,preset.background.image?'/widget-assets/'+preset.background.image+'.png?key='+encodeURIComponent(key):'',false,font=>'/widget-fonts/'+font.id+'.'+font.format+'?key='+encodeURIComponent(key))}return}NextUpWidget.resetPresentation(box);box.className='card '+layout+(sample.playing?' playing':'');const rows=layout==='queue'?d.items:current?[current]:[],sig=JSON.stringify([rows,layout,equalizer,label,eqStyle,preset?.equalizer_response,preset?.equalizer_color_source]);if(sig!==signature){signature=sig;if(!rows.length)box.innerHTML='<div class="empty">'+(layout==='queue'?'The queue is clear':'Nothing playing')+'</div>';else if(layout==='queue')box.innerHTML=(label?'<div class="brand">'+esc(label)+'</div>':'')+rows.slice(0,6).map(row=>'<div class="entry">'+cover(row.track)+info(row,false,label)+'</div>').join('');else box.innerHTML=cover(current.track)+info(current,true,label)+(layout==='spectrum'&&equalizer?'<div class="bars" data-eq-style="'+esc(eqStyle)+'" data-eq-response="'+esc(JSON.stringify(preset?.equalizer_response||{}))+'" data-eq-color-source="'+esc(preset?.equalizer_color_source||'custom')+'" data-eq-art="'+esc(current?.track.art||'')+'" aria-label="Equalizer">'+Array.from({length:16},(_,i)=>`<i style="animation-delay:-${i*.17}s;animation-duration:${.65+(i%5)*.16}s;height:${25+(i*13)%75}%"></i>`).join('')+'</div>':'')}}catch{NextUpWidget.hidePresentation(box);sample.playing=false;box.classList.remove('playing');box.classList.add('offline')}finally{refreshing=false}}function animate(){if(performance.now()-goodAt>6000){NextUpWidget.hidePresentation(box);sample.playing=false;box.classList.remove('playing')}const seconds=Math.min(sample.duration,sample.seconds+(sample.playing?Math.min(5,(performance.now()-sample.at)/1000):0)),fill=box.querySelector('.fill'),clock=document.getElementById('elapsed');if(!box.querySelector('.wv-stage')&&box.dataset.foldPhase!=='closing'&&box.dataset.horizonPhase!=='closing'){if(fill)fill.style.width=(sample.duration?seconds/sample.duration*100:0)+'%';if(clock)clock.textContent=time(seconds);}requestAnimationFrame(animate)}refresh();setInterval(refresh,1500);requestAnimationFrame(animate);
</script></body></html>
