<!doctype html><html><head><meta charset="utf-8"><title>NextUp</title><style>body{font:14px system-ui;background:#111923;color:#edf3f8;width:310px;padding:18px;margin:0}h1{font-size:19px}p{line-height:1.5;color:#b5c3d0}input,button{box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border-radius:7px;border:1px solid #465566;background:#202d3a;color:white}button{cursor:pointer}button.primary{background:#a9e7bb;color:#102518}#status{min-height:42px}label{display:block}</style></head><body><h1>NextUp</h1><p id="status" role="status">Checking connection…</p><label>Pairing code from NextUp<input id="code" type="password" autocomplete="off" spellcheck="false"></label><button id="pair" class="primary">Pair with NextUp</button><button id="open">Open YouTube tab</button><button id="select">Use this YouTube tab</button><button id="repair">Repair player connection</button><button id="connect">Reconnect</button><button id="disconnect">Disconnect and forget pairing</button><p>Keep this tab open. Play one video manually if your browser asks for interaction. NextUp controls only the selected tab. Ads and YouTube restrictions remain in effect.</p><p>Pairing credentials and selected-tab playback status are sent only to NextUp on this computer.</p><script src="popup.js"></script></body></html>
